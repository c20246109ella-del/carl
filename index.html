<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @custom-variant dark (&:where(.dark, .dark *));

        @layer components {
            .btn-primary {
                @apply underline px-6 py-3 bg-blue-800 text-white rounded-full hover:bg-yellow-400 hover:text-blue-950 transition-colors duration-300;
            }
            .btn-secondary {
                @apply px-6 py-4 bg-blue-800 text-white flex items-center justify-between rounded-lg hover:bg-cyan-400 hover:text-blue-950 transition-colors duration-300;
            }
            .accent {
                @apply px-4 py-2 text-blue-800 dark:text-cyan-300 hover:text-yellow-500 transition-colors duration-300;
            }
            .content {
                @apply h-[40vh] flex flex-col justify-center text-left border border-cyan-300 dark:border-slate-700 rounded-2xl p-8 md:p-12 my-8 bg-white dark:bg-slate-900 shadow-lg shadow-blue-900/10 hover:border-yellow-400 duration-300;
            }
            .hero {
                @apply underline decoration-cyan-400 text-5xl md:text-7xl font-black text-blue-900 dark:text-white my-12 hover:text-yellow-400 transition-colors duration-300 hover:decoration-blue-700;
            }
            .navigation {
                @apply flex justify-between items-center mx-6 md:mx-[50px] mb-10 max-[600px]:flex-col max-[600px]:gap-[15px];
            }
            .ul {
                @apply flex gap-3 list-none max-[600px]:flex-col max-[600px]:text-center;
            }
            .main {
                @apply mx-auto max-w-5xl px-6;
            }
            .span {
                @apply text-yellow-400 hover:text-blue-400 transition-colors duration-300;
            }
            .header-nav{
                @apply bg-blue-900/90 dark:bg-blue-950/90 border border-cyan-400/40 rounded-2xl p-4 shadow-xl shadow-cyan-950/20 backdrop-blur-md;
            }
            .footer{
                @apply mx-6 mt-12 mb-6 border-t border-cyan-400/30 pt-6;
            }
    }
    </style>
</head>

<body
    class="relative text-center bg-white text-blue-950 dark:bg-slate-950 dark:text-white transition-colors duration-500">

    <h1 class="hero my-12">
        <span class="block text-sm md:text-base tracking-[0.5em] text-cyan-500 no-underline mb-4">
            WELCOME TO MY WORLD
        </span>
        Carl Benedict
        <span class="block text-cyan-400">
            P. Ella<span class="span">.</span>
        </span>

        <span class="block text-xs md:text-sm tracking-[0.4em] mt-6 text-cyan-500 no-underline">
            Cyber WEB
        </span>
    </h1>


    <button id="toggledark" class="btn-primary mb-8">
        Toggle
    </button>
    <button id="timelineBtn" class="btn-primary mb-8">
        Replay Intro
    </button>

    <header>
        <nav class="navigation header-nav">

            <span id="head"
                class="font-bold text-blue-800 dark:text-cyan-300 hover:text-yellow-400 transition-colors duration-300">
                @CarloCarl
            </span>

            <ul class="ul">
                <li>
                    <a class="accent" href="#projects">Projects</a>
                </li>

                <li>
                    <a class="accent" href="#services">Services</a>
                </li>

                <li>
                    <a class="accent" href="#contact">Contact</a>
                </li>
            </ul>

        </nav>
    </header>

    <main class="main">

      <button id="flip" class="btn-primary mb-8">flip</button>
      <div id="dive" class="grid grid-cols-1 gap-8">

    
        <section id="projects"
            class="content relative overflow-hidden border-l-4 border-l-cyan-400 bg-blue-700/10 dark:bg-cyan-950/30 hover:shadow-cyan-400/20">

            <span
                class="absolute -right-2 -bottom-10 text-[150px] font-black text-cyan-400/10 pointer-events-none select-none">
                01
            </span>

            <h2 class="hero relative z-10">
                About<span class="span">.</span>
            </h2>

            <p class="accent relative z-10 text-left">
                This amazing page minimum design
                <span class="text-yellow-400">:)</span>
            </p>

            <div class="absolute top-6 right-6 w-3 h-3 bg-yellow-400 rounded-full"></div>
        </section>

        <section id="services"
            class="content relative overflow-hidden border-l-4 border-l-cyan-400 bg-cyan-500/10 dark:bg-blue-900/50 hover:shadow-cyan-400/20">

            <span
                class="absolute -right-2 -bottom-10 text-[150px] font-black text-cyan-400/10 pointer-events-none select-none">
                02
            </span>

            <h2 class="hero relative z-10">
                Services<span class="span">.</span>
            </h2>

            <p class="accent relative z-10 text-left">
                For yours truly
                <span class="text-yellow-400">:)</span>
            </p>

            <div class="absolute top-6 right-6 flex gap-2">
                <span class="w-3 h-3 rounded-full bg-cyan-400"></span>
                <span class="w-3 h-3 rounded-full bg-blue-500"></span>
                <span class="w-3 h-3 rounded-full bg-yellow-400"></span>
            </div>
        </section>


        <section id="contact"
            class="content relative overflow-hidden border-l-4 border-l-cyan-400 bg-blue-800/10 dark:bg-blue-900/60 hover:shadow-yellow-400/10">

            <span
                class="absolute -right-5 -bottom-16 text-[150px] font-black text-yellow-400/10 pointer-events-none select-none">
                03
            </span>

            <h2 class="hero relative z-10">
                Contact<span class="span">.</span>
            </h2>

            <p class="accent relative z-10 text-left">
                Me ASAP
                <span class="text-yellow-400">:)</span>
            </p>
        </section>
</div>
    </main>

    <h1 id="wow" class="span">wowowow</h1>
    <footer class="footer">
        <p class="text-xs tracking-[0.3em] text-cyan-600 dark:text-cyan-400">
            cyberpunk inspired
        </p>

        <p class="text-sm text-blue-800 dark:text-cyan-100 mt-2">
            Cyber space
            <span class="text-yellow-400">@</span>
        </p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
   <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/Flip.min.js"></script> 

    <script>console.log("Gsap ver", gsap.version);
        //tween
        //gsap.to("h1",{x:200,duration:3});
        //gsap.from("h1",{y:200,opacity:0,duration:1});
        //gsap.to("h1",{opacity:0,opacity:1,duration:3});
        //easing
        //gsap.from("h1",{y:-60,opacity:0,duration:1,ease:"power2.out"});
        //gsap.from("h1",{y:-60,opacity:0,duration:1,ease:"back.out(2.5)"});
        //gsap.from("h1",{y:-60,opacity:0,duration:1,ease:"bounce.out"});
        //gsap.from("h1", { y: -60, opacity: 0, duration: 3, ease: "elastic.out(3,0.5)" });
        //stagger
        //gsap.from("nav a",{y:-100,opacity:0,duration:0.5,ease:"bounce.out",stagger:1})

        //timeline
        const tl = gsap.timeline({ defaults: { duration: 0.5, ease: "bounce.out" } });
        tl.from("h1", { y: -60, opacity: 0, duration: 2, ease: "elastic.out(2,0.5)" });
        tl.from("nav a", { y: -30, opacity: 0.5, duration: 0.5, ease: "bounce.out", stagger: 0.5 });
        tl.from("main", { y: -100, opacity: 0.5, duration: 0.5, ease: "bounce.out", stagger: 0.5 });
        tl.from("button", { y: -50, opacity: 0.5, duration: 1, ease: "bounce.out", stagger: 0.5 });
        tl.to("header span", { y: -50, duration: 1, ease: "bounce.out", stagger: 0.5 });
        tl.to("header span", { rotation: "+=360", duration: 0.8, ease: "none", repeat: -1 });
        tl.to("header span", { x: 1000, duration: 5, ease: "none" });
        tl.to("header span", { y: -250, duration: 1, ease: "none" });
        tl.to("header span", { x: -10, duration: 5, ease: "none" });
        tl.to("header span", { y: -10, duration: 1, ease: "none" });
        const timelineBtn = document.querySelector("#timelineBtn");

        timelineBtn.addEventListener("click", function () {
            tl.restart();
        });
    </script>
    <script>
        const toggleButton = document.querySelector("#toggledark");
        const html = document.querySelector("html");
        const wow = document.querySelector("#wow");
        const head = document.querySelector("#head");
        gsap.from(wow, {
            opacity: 0.5, duration: 1, ease: "power2.out"


        });
        gsap.registerPlugin(ScrollTrigger);

        toggleButton.addEventListener("click", function () {
            html.classList.toggle("dark");
            gsap.to(toggleButton, { rotation: "+=360", duration: 0.8, ease: "none" });

        });
        wow.addEventListener("click", function () {
            gsap.to(wow, { rotation: "+=360", duration: 0.8, ease: "none", repeat: -1 });
        });

    </script>
<script>
    gsap.registerPlugin(Flip);

    const dive = document.querySelector("#dive");
    const flipButton = document.querySelector("#flip");

    flipButton.addEventListener("click", () => {
        const state = Flip.getState("#dive .content");
        dive.classList.toggle("grid-cols-2");
        Flip.from(state, {
            duration: 1,
            stagger: 0.2,
            ease: "power2.inOut"
        });

    });
</script>
</body>

</html>
